<VirtualHost *:443>
    ServerName nomorewaste.local
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/nmw.crt
    SSLCertificateKeyFile /etc/apache2/ssl/nmw.key
    <Directory /var/www/html>
        AllowOverride All
        Require all granted

        # Reecriture d'URL : /frontoffice/forums sert forums.php, sans
        # exposer l'extension. Le garde -f evite de detourner un fichier
        # statique ou un repertoire existant.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME}\.php -f
        RewriteRule ^(.+?)/?$ $1.php [L]
    </Directory>

    ErrorDocument 403 /erreur.php
    ErrorDocument 404 /erreur.php
    ErrorDocument 500 /erreur.php
</VirtualHost>
